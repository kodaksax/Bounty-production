name: Deploy Supabase Edge Functions

# Root cause this closes (docs/withdrawals/11-final-hardening-session-2026-07-19.md
# §6d, docs/withdrawals/12-comprehensive-audit-2026-07-18.md §11 item 3): there
# was no automated deploy path for Edge Functions at all — every deploy was a
# manual, per-function CLI call. That gap directly caused two real incidents
# (payments/apple-pay silently drifting for months, and the 2026-07-17 connect
# regression that produced a stuck withdrawal). This workflow makes "what's on
# main" and "what's live" the same thing by construction, with a post-deploy
# verification step that fails loudly instead of requiring another manual
# audit session to notice drift.
#
# Scope: only the function directories that live in this repo
# (supabase/functions/*, excluding _shared and non-directories). The four
# functions with no git history (workflow-tracker, signed-image-proxy,
# stripe-setup, stripe-worker — see docs/withdrawals project memory on
# "shadow edge functions") are deliberately untouched by this workflow, same
# as by scripts/deploy-functions.js today.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:
    inputs:
      functions:
        description: 'Space-separated function slugs to redeploy (blank = all changed/all functions)'
        required: false
        default: ''

concurrency:
  group: deploy-edge-functions-production
  cancel-in-progress: false

jobs:
  verify:
    name: Type-check and lint every function
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      functions: ${{ steps.discover.outputs.functions }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          # Matches the Supabase Edge Runtime's default (supabase/config.toml
          # has no [edge_runtime].deno_version override, and the CLI's own
          # current default is deno_version = 2). Checking against a
          # different major version than what actually executes in
          # production defeats the point of this verify step.
          deno-version: v2.x

      - name: Discover function directories
        id: discover
        run: |
          cd supabase/functions
          FUNCS=$(find . -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | grep -v '^_' | sort | tr '\n' ' ')
          echo "Discovered: $FUNCS"
          echo "functions=$FUNCS" >> "$GITHUB_OUTPUT"

      # --config + --node-modules-dir=auto are both required: this repo's
      # root package.json (the Expo app) is an ancestor of every function
      # directory, so without a scoped supabase/functions/deno.json, Deno 2
      # mis-detects the functions as part of that npm workspace and every
      # npm: import fails to resolve. --node-modules-dir=auto must also be
      # passed explicitly on the CLI — the same setting in deno.json alone
      # is not honored consistently by `deno check`/`deno lint`.
      - name: deno check every discovered function's entrypoint
        run: |
          for fn in ${{ steps.discover.outputs.functions }}; do
            entry="supabase/functions/$fn/index.ts"
            if [ -f "$entry" ]; then
              echo "::group::deno check $fn"
              deno check --config supabase/functions/deno.json --node-modules-dir=auto "$entry"
              echo "::endgroup::"
            else
              echo "::warning::$fn has no index.ts entrypoint, skipping deno check"
            fi
          done

      - name: deno lint every discovered function
        run: |
          for fn in ${{ steps.discover.outputs.functions }}; do
            echo "::group::deno lint $fn"
            deno lint --config supabase/functions/deno.json "supabase/functions/$fn"
            echo "::endgroup::"
          done

  deploy:
    name: Deploy to production
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: xwlwqzzphmmhghiqvkeu
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history: the push-event diff below needs `github.event.before`
          # to actually be present locally. A shallow fetch-depth: 2 only
          # covers a single-commit push — anything else (a multi-commit push,
          # a merge bringing in more than one commit) leaves `before` outside
          # the shallow clone and makes `git diff` fail outright.
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Determine which functions to deploy
        id: targets
        run: |
          if [ -n "${{ github.event.inputs.functions }}" ]; then
            TARGETS="${{ github.event.inputs.functions }}"
            echo "Manual dispatch: deploying explicitly requested functions: $TARGETS"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGETS="${{ needs.verify.outputs.functions }}"
            echo "Manual dispatch with no function list: deploying all discovered functions: $TARGETS"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            # First push to a new branch (before = all-zeros), or the before
            # commit is otherwise unreachable — there's no diff to compute,
            # so fall back to deploying every discovered function instead of
            # failing the job outright.
            TARGETS="${{ needs.verify.outputs.functions }}"
            echo "No usable 'before' commit for diffing: deploying all discovered functions: $TARGETS"
          else
            # push event: only redeploy functions whose directory actually changed,
            # so an unrelated function's version doesn't bump on every merge.
            CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- 'supabase/functions/*' \
              | grep -v '^supabase/functions/_' \
              | sed -E 's#^supabase/functions/([^/]+)/.*#\1#' \
              | sort -u | tr '\n' ' ')
            TARGETS="$CHANGED"
            echo "Push event: redeploying changed functions: $TARGETS"
          fi
          if [ -z "$TARGETS" ]; then
            echo "No functions to deploy — exiting cleanly."
          fi
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"

      - name: Record pre-deploy function versions
        if: steps.targets.outputs.targets != ''
        run: |
          mkdir -p /tmp/predeploy-versions
          for fn in ${{ steps.targets.outputs.targets }}; do
            HTTP_CODE=$(curl -s -o /tmp/meta.json -w '%{http_code}' \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/functions/$fn")
            if [ "$HTTP_CODE" = "200" ]; then
              jq -r '.version' /tmp/meta.json > "/tmp/predeploy-versions/$fn"
            else
              # 404 (function doesn't exist yet) is expected for a brand-new
              # function — treat it as version 0 so the post-deploy check
              # just requires *a* version to show up.
              echo 0 > "/tmp/predeploy-versions/$fn"
            fi
          done

      - name: Deploy each target function
        if: steps.targets.outputs.targets != ''
        run: |
          for fn in ${{ steps.targets.outputs.targets }}; do
            echo "::group::Deploying $fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
            echo "::endgroup::"
          done

      # Confirms each deploy actually registered a new active version, rather
      # than the CLI reporting success while nothing changed server-side —
      # the failure mode behind the historical payments/apple-pay and
      # 2026-07-17 connect incidents. This checks Management API metadata
      # (status + version) instead of diffing source against the `/body`
      # endpoint: that endpoint returns a bundled eszip blob (a
      # StreamableFile), not the JSON {name, content} shape the old version
      # of this step assumed, so it never actually verified anything.
      - name: Post-deploy verification — function must be ACTIVE on a new version
        if: steps.targets.outputs.targets != ''
        run: |
          FAILED=0
          for fn in ${{ steps.targets.outputs.targets }}; do
            echo "::group::Verifying $fn"
            PREV=$(cat "/tmp/predeploy-versions/$fn")
            HTTP_CODE=$(curl -s -o /tmp/meta.json -w '%{http_code}' \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/functions/$fn")
            if [ "$HTTP_CODE" != "200" ]; then
              echo "::error::$fn: could not fetch post-deploy metadata (HTTP $HTTP_CODE)"
              FAILED=1
            else
              STATUS=$(jq -r '.status' /tmp/meta.json)
              NEW_VERSION=$(jq -r '.version' /tmp/meta.json)
              if [ "$STATUS" != "ACTIVE" ]; then
                echo "::error::$fn: status is '$STATUS', not ACTIVE — deploy did not take effect as expected"
                FAILED=1
              elif [ "$NEW_VERSION" -le "$PREV" ]; then
                echo "::error::$fn: version did not advance (was $PREV, still $NEW_VERSION) — deploy did not take effect as expected"
                FAILED=1
              else
                echo "$fn: verified — ACTIVE at version $NEW_VERSION (was $PREV)"
              fi
            fi
            echo "::endgroup::"
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "::error::One or more functions failed post-deploy verification — investigate before assuming this deploy is live."
            exit 1
          fi
