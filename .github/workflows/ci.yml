name: CI - Tests and Linting

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  test:
    name: Run Tests (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build workspace packages
        run: npm run build

      - name: Validate environment variables
        run: npm run env:check
        env:
          APP_ENV: development
          ALLOW_MISSING_SECRETS: '1'
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}

      - name: Run linter
        run: npm run lint --if-present
        # continue-on-error: true

      - name: Run type check
        run: npm run type-check --if-present
        # continue-on-error: true

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true # OK - This is for visibility only

      - name: Run dependency check
        run: npm run audit:deps
        continue-on-error: true # OK - This is for visibility only

      - name: Run unit tests
        run: npm run test:unit
        env:
          NODE_ENV: test
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}

      - name: Run integration tests
        run: npm run test:integration
        env:
          NODE_ENV: test
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          NODE_ENV: test
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Generate coverage report
        run: npm run test:coverage
        env:
          NODE_ENV: test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@5c47607acb93fed5485fdbf7232e8a31425f672a # v4.6.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: test-results-${{ matrix.node-version }}
          path: |
            coverage/
            __tests__/**/*.test.ts
          retention-days: 30

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: ArtiomTr/jest-coverage-report-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          lcov-file: ./coverage/lcov.info
          title: Coverage Report
          update-comment: true
        continue-on-error: true

  build:
    name: Build Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build packages
        run: npm run build

      # The bundler can emit sourcemap mappings with non-finite spans
      # (e.g. "generated column Infinity") which break the visualizer JSON
      # parser. `scripts/check-bundle-size.js` runs a sanitizer that removes
      # those mappings and ensures `tmp_bundle/result.json` is produced.
      - name: Check bundle size budget
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: npm run bundle:size-check
        env:
          NODE_ENV: production
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Upload tmp_bundle artifacts (bundle debug)
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: tmp_bundle-artifacts
          path: tmp_bundle/**
          retention-days: 7

      - name: Validate Expo iOS export
        run: npx expo export --platform ios --output-dir dist/ios --max-workers 2
        env:
          NODE_ENV: production
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Validate Expo Android export
        run: npx expo export --platform android --output-dir dist/android --max-workers 2
        env:
          NODE_ENV: production
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Check build artifacts
        run: |
          if [ ! -d "dist/ios" ] || [ ! -d "dist/android" ]; then
            echo "❌ Build failed: dist directories not created"
            exit 1
          fi
          echo "✅ Build validation successful"
          ls -R dist/

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: expo-mobile-build-artifacts
          path: dist/
          retention-days: 7

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Run dependency check
        run: npm run audit:deps
        continue-on-error: true

  edge-functions:
    name: Check Supabase Edge Functions (Deno)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Pre-merge counterpart to the verify job in deploy-edge-functions.yml:
    # that one only runs on push to main under a supabase/functions/**
    # path filter, so without this job a broken function is only caught on
    # the way to production. Both must run the *same* commands against the
    # *same* Deno major, or this job stops being a meaningful gate.
    #
    # This job used to be pinned to v1.x and invoked bare `deno check`
    # without --config/--node-modules-dir, which cannot resolve the npm:
    # imports these functions use (the repo-root package.json is an
    # ancestor of every function dir, so Deno treats them as part of the
    # Expo app's npm workspace and every `npm:stripe@14`-style specifier
    # fails). continue-on-error meant that failure was never surfaced, so
    # the check had never actually validated anything since it was added.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          # Must match deploy-edge-functions.yml and the Supabase Edge
          # Runtime default (deno_version = 2). Checking against a
          # different major than what runs in production proves nothing.
          deno-version: v2.x

      - name: Discover function directories
        id: discover
        run: |
          cd supabase/functions
          FUNCS=$(find . -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | grep -v '^_' | grep -v '^node_modules$' | sort | tr '\n' ' ')
          echo "Discovered: $FUNCS"
          echo "functions=$FUNCS" >> "$GITHUB_OUTPUT"

      # --config + --node-modules-dir=auto are both required — see the
      # matching step in deploy-edge-functions.yml for the full rationale.
      - name: deno check every discovered function's entrypoint
        run: |
          for fn in ${{ steps.discover.outputs.functions }}; do
            entry="supabase/functions/$fn/index.ts"
            if [ -f "$entry" ]; then
              echo "::group::deno check $fn"
              deno check --config supabase/functions/deno.json --node-modules-dir=auto "$entry"
              echo "::endgroup::"
            else
              echo "::warning::$fn has no index.ts entrypoint, skipping deno check"
            fi
          done

      - name: deno lint every discovered function
        run: |
          for fn in ${{ steps.discover.outputs.functions }}; do
            echo "::group::deno lint $fn"
            deno lint --config supabase/functions/deno.json "supabase/functions/$fn"
            echo "::endgroup::"
          done

  report:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test, build, lint, security, edge-functions]
    if: always()
    permissions:
      contents: read

    steps:
      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
        continue-on-error: true

      - name: Test Summary
        run: |
          echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All tests completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View detailed results in the artifacts." >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
